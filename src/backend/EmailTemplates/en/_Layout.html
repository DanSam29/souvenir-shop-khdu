<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{Title}}</title>
  <style>
    .email-body h1 { font-size: 22px; color: #0056b3; margin: 0 0 16px; }
    .email-body p { margin: 0 0 12px; }
    .email-body a { color: #007bff; }
    .email-body a.btn { display: inline-block; background: #007bff; color: #ffffff !important; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; }
    .email-body .muted { font-size: 13px; color: #6c757d; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f7fa;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#0056b3;background-image:linear-gradient(135deg,#0056b3 0%,#007bff 100%);padding:20px 24px;">
              <a href="{{ClientUrl}}" style="text-decoration:none;color:#ffffff;">
                <img src="{{LogoUrl}}" alt="KSU" width="44" height="44" style="vertical-align:middle;border-radius:8px;background-color:#ffffff;padding:4px;" />
                <span style="font-size:18px;font-weight:bold;margin-left:12px;vertical-align:middle;color:#ffffff;">KSU Souvenir Shop</span>
              </a>
            </td>
          </tr>
          <tr>
            <td class="email-body" style="padding:32px 24px;font-size:15px;line-height:1.6;color:#1a1a1a;">
{{Content}}
            </td>
          </tr>
          <tr>
            <td style="background-color:#1a1a1a;color:#c3cfe2;padding:20px 24px;font-size:12px;line-height:1.5;">
              <p style="margin:0 0 6px;">Kherson State University &mdash; souvenir shop</p>
              <p style="margin:0 0 6px;">&copy; {{Year}} KSU Souvenir Shop. All rights reserved.</p>
              <p style="margin:0;">This is an automated message, please do not reply.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
