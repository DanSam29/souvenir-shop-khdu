services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5225:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5225/api
    depends_on:
      - backend
